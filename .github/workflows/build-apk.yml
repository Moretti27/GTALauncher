name: Build APK
on: [push, workflow_dispatch]
jobs:
 build:
  runs-on: ubuntu-24.04
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v5
     with: { distribution: temurin, java-version: '17' }
   - name: Prepare Android SDK
     shell: bash
     run: |
       export ANDROID_HOME=/usr/local/lib/android/sdk
       export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
       SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
       yes | "$SDKMANAGER" --licenses >/dev/null || true
       "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.1"
   - uses: gradle/actions/setup-gradle@v4
     with: { gradle-version: '8.11.1' }
   - name: Build installable APK
     env:
       ANDROID_HOME: /usr/local/lib/android/sdk
       ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
     run: gradle :app:assembleDebug --stacktrace
   - run: cp app/build/outputs/apk/debug/app-debug.apk ICQ-Reborn.apk
   - uses: actions/upload-artifact@v4
     with: { name: ICQ-Reborn, path: ICQ-Reborn.apk }
