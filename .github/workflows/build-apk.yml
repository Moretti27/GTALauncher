name: Build APK and Publish Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;35.0.1"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Read app version
        shell: bash
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Build installable APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release files
        shell: bash
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "ICQ-Reborn-$TAG.apk"
          cp app/build/outputs/apk/debug/app-debug.apk ICQ-Reborn.apk
          sha256sum "ICQ-Reborn-$TAG.apk" > "ICQ-Reborn-$TAG.apk.sha256"

          mkdir -p "ICQ-Reborn-PC-Host-$TAG/server"
          cp server/server.js "ICQ-Reborn-PC-Host-$TAG/server/server.js"
          cp server/package.json "ICQ-Reborn-PC-Host-$TAG/server/package.json"
          cp START_SERVER.bat "ICQ-Reborn-PC-Host-$TAG/START_SERVER.bat"
          cp SERVER_README.md "ICQ-Reborn-PC-Host-$TAG/SERVER_README.md"
          cp server-config.json "ICQ-Reborn-PC-Host-$TAG/server-config.json"
          zip -r "ICQ-Reborn-PC-Host-$TAG-22005.zip" "ICQ-Reborn-PC-Host-$TAG"
          sha256sum "ICQ-Reborn-PC-Host-$TAG-22005.zip" > "ICQ-Reborn-PC-Host-$TAG-22005.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ICQ-Reborn-${{ env.TAG }}
          path: |
            ICQ-Reborn.apk
            ICQ-Reborn-${{ env.TAG }}.apk
            ICQ-Reborn-${{ env.TAG }}.apk.sha256
            ICQ-Reborn-PC-Host-${{ env.TAG }}-22005.zip
            ICQ-Reborn-PC-Host-${{ env.TAG }}-22005.zip.sha256

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; replacing APK asset."
          else
            gh release create "$TAG"               --target "$GITHUB_SHA"               --title "ICQ Reborn $TAG"               --prerelease               --notes "Automated ICQ Reborn Android build. See CHANGELOG.md in the repository for changes."
          fi

          gh release upload "$TAG"             "ICQ-Reborn-$TAG.apk"             "ICQ-Reborn-$TAG.apk.sha256"             "ICQ-Reborn-PC-Host-$TAG-22005.zip"             "ICQ-Reborn-PC-Host-$TAG-22005.zip.sha256"             --clobber
