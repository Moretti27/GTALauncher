<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ICQ Reborn</title><style>
:root{--bg:#07110b;--card:#0b1a10;--card2:#102218;--green:#7df56d;--green2:#b8ff75;--text:#f5fff4;--muted:#91a895;--line:#23402a;--red:#ff6b6b;--amber:#ffd166}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% 0,#12321a 0,transparent 28%),linear-gradient(#06100a,#0a140d);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}button,input,select{font:inherit}.hide{display:none!important}.wrap{padding:14px 12px 94px;max-width:760px;margin:auto}.top{position:sticky;top:0;z-index:5;padding:12px 14px;display:flex;align-items:center;gap:10px;background:#07110bf2;border-bottom:1px solid #17301e;backdrop-filter:blur(12px)}.flower{font-size:31px}.grow{flex:1}.sub,.state{font-size:12px;color:var(--muted)}.pill{padding:6px 10px;border:1px solid #2a5031;border-radius:999px;background:#102819;font-size:12px}.card{background:linear-gradient(180deg,#0d1d12,#09160e);border:1px solid var(--line);border-radius:22px;padding:15px;margin-bottom:12px;box-shadow:0 14px 36px #0004}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.f,button,select{border:1px solid #294b30;border-radius:15px;padding:11px 12px;background:#102218;color:var(--text)}button{font-weight:700}.primary{background:linear-gradient(180deg,var(--green2),var(--green));color:#08200c;border:0}.danger{background:#432020;color:#ffdede}.screen{display:none}.screen.on{display:block}.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;z-index:8;background:#07110b;border-top:1px solid #17301e;padding:7px 5px 10px}.tabs button{flex:1;border:0;background:none;color:#819487;padding:8px 3px}.tabs button.on{color:var(--green);background:#112319}.profile{display:flex;gap:12px;align-items:center}.avatar{width:48px;height:48px;border-radius:50%;background:#173c20;display:grid;place-items:center;font-weight:900;font-size:19px}.dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;background:#777}.ONLINE .dot{background:#66ef65}.AWAY .dot{background:#ffd166}.DND .dot,.OCCUPIED .dot{background:#ff6b6b}.contact,.group{display:flex;align-items:center;gap:10px;padding:12px 2px;border-bottom:1px solid #17291c}.contact:last-child,.group:last-child{border-bottom:0}.chat{height:50vh;overflow:auto;padding:8px;background:#07110b;border-radius:18px;border:1px solid #14281a}.b{max-width:84%;padding:9px 11px;margin:7px 0;background:#132419;border-radius:17px}.b.me{margin-left:auto;background:#1b4924}.time{font-size:10px;color:#8ea292;margin-left:7px}.composer{display:flex;gap:7px;margin-top:8px}.composer input{flex:1}.filebox{display:inline-block;padding:8px 10px;border:1px solid #35543b;border-radius:12px;margin-top:6px;color:#d7fbd9;text-decoration:none}.videos{display:grid;grid-template-columns:1fr 1fr;gap:8px}.videos video{width:100%;min-height:160px;background:#000;border-radius:18px}.auth{max-width:500px;margin:20px auto}.auth h2{text-align:center}.sectionTitle{font-size:12px;color:#89a08e;text-transform:uppercase;letter-spacing:.08em;margin:8px 2px}.phoneLinked{padding:10px;border:1px solid #2d4932;border-radius:14px;background:#102018}.badge{font-size:11px;color:#b9cbbb}.notice{font-size:12px;padding:10px;border-radius:14px;background:#111e15;color:#b8c9bb}.groupchips{display:flex;gap:6px;flex-wrap:wrap}.chip{padding:7px 9px;border-radius:999px;background:#15291a;border:1px solid #29492e}
@media(max-width:560px){.wrap{padding:10px 9px 90px}.card{border-radius:19px}.videos{grid-template-columns:1fr}}
</style></head><body>
<div id="authView" class="wrap auth">
<div style="font-size:56px;text-align:center">🌼</div><h2>ICQ <span style="color:var(--green)">Reborn</span></h2>
<div class="card"><div class="sectionTitle">Сервер</div><input id="authServer" class="f" style="width:100%"><button id="checkServer" class="primary" style="width:100%;margin-top:8px">Проверить подключение</button><div id="serverCheckState" class="state"></div></div>
<div id="loginCard" class="card"><div class="sectionTitle">Вход</div><input id="loginUin" class="f" style="width:100%" placeholder="UIN"><input id="loginPass" class="f" type="password" style="width:100%;margin-top:8px" placeholder="Пароль"><div class="row" style="margin-top:8px"><button id="loginBtn" class="primary grow">Войти</button><button id="showReg" class="grow">Регистрация</button></div><div id="authState" class="state"></div></div>
<div id="regCard" class="card hide"><div class="sectionTitle">Регистрация</div><input id="regNick" class="f" style="width:100%" placeholder="Ник"><input id="regPhone" class="f" inputmode="tel" style="width:100%;margin-top:8px" placeholder="Номер телефона"><input id="regPass" class="f" type="password" style="width:100%;margin-top:8px" placeholder="Пароль, минимум 6 символов"><div class="row" style="margin-top:8px"><button id="regBtn" class="primary grow">Создать аккаунт</button><button id="showLogin">Назад</button></div></div>
</div>
<div id="appView" class="hide">
<div class="top"><div class="flower">🌼</div><div><b>ICQ Reborn</b><div id="head" class="sub"></div></div><div class="grow"></div><span id="serverState" class="pill">offline</span></div>
<div class="wrap">
<section id="contacts" class="screen on">
<div class="card"><div class="profile"><div id="meAvatar" class="avatar">?</div><div class="grow"><b id="meName"></b><div class="sub">UIN <span id="uin"></span></div></div><select id="status"><option>ONLINE</option><option>AWAY</option><option>DND</option><option>OCCUPIED</option><option>INVISIBLE</option></select></div></div>
<div class="card"><div class="row"><input id="addUin" class="f grow" placeholder="Добавить по UIN"><button id="addBtn" class="primary">Добавить</button></div><button id="syncPhone" style="width:100%;margin-top:8px">📱 Найти друзей из телефона</button><div id="syncState" class="state"></div></div>
<div class="sectionTitle">Контакты</div><div class="card" id="list"></div>
</section>
<section id="groups" class="screen"><div class="card"><div class="sectionTitle">Новая группа</div><input id="groupName" class="f" style="width:100%" placeholder="Название группы"><div id="memberChips" class="groupchips" style="margin:9px 0"></div><button id="createGroup" class="primary" style="width:100%">Создать группу</button></div><div class="sectionTitle">Мои группы</div><div class="card" id="groupList"></div></section>
<section id="chat" class="screen"><div class="card"><div class="row"><h3 id="chatTitle" class="grow" style="margin:0">Чат</h3><span id="peer" class="pill">сервер</span></div><div id="messages" class="chat" style="margin-top:10px"></div><div class="composer"><label class="f">📎<input id="file" type="file" hidden></label><input id="msg" class="f" placeholder="Сообщение"><button id="send" class="primary">➤</button></div><div id="sendState" class="state"></div></div></section>
<section id="calls" class="screen"><div id="incoming" class="card hide"><b id="incomingText"></b><div class="row" style="margin-top:8px"><button id="take" class="primary">Принять</button><button id="reject" class="danger">Отклонить</button></div></div><div class="card"><div class="row"><button id="callA" class="primary">📞 Аудио</button><button id="callV" class="primary">🎥 Видео</button><button id="hang" class="danger">Завершить</button><button id="mute">🎙️</button><button id="cam">📷</button></div><div id="callState" class="state">Нет звонка</div><div class="videos" style="margin-top:10px"><video id="remote" autoplay playsinline></video><video id="local" autoplay muted playsinline></video></div></div></section>
<section id="settings" class="screen">
<div class="card"><div class="sectionTitle">Профиль</div><input id="nick" class="f" style="width:100%" placeholder="Ник"><button id="save" class="primary" style="width:100%;margin-top:8px">Сохранить профиль</button></div>
<div class="card"><div class="sectionTitle">Телефон</div><div id="phoneSummary" class="phoneLinked"></div><input id="myPhone" class="f" inputmode="tel" style="width:100%;margin-top:8px" placeholder="Новый номер телефона"><div class="row" style="margin-top:8px"><button id="savePhone" class="primary grow">Привязать / заменить</button><button id="unlinkPhone">Отвязать</button></div></div>
<div class="card"><div class="sectionTitle">Сервер</div><input id="serverUrl" class="f" style="width:100%"><button id="saveServer" style="width:100%;margin-top:8px">Сохранить адрес</button></div>
<div class="card"><button id="logout" class="danger" style="width:100%">Выйти из аккаунта</button></div>
</section></div>
<div class="tabs"><button class="on" data-s="contacts">Контакты</button><button data-s="groups">Группы</button><button data-s="chat">Чат</button><button data-s="calls">Звонки</button><button data-s="settings">⚙</button></div>
</div>
<script>
'use strict';const $=x=>document.getElementById(x);
function storeGet(k){try{let v=NativeBridge.prefGet(k);if(v)return v}catch(_){}return localStorage.getItem(k)||''}
function storeSet(k,v){try{NativeBridge.prefSet(k,v)}catch(_){}localStorage.setItem(k,v)}
function storeRemove(k){try{NativeBridge.prefRemove(k)}catch(_){}localStorage.removeItem(k)}
let base=(storeGet('serverUrl')||'http://192.168.3.3:22005').replace(/\/$/,'');
let token=storeGet('token')||'',me=null,contacts=[],groups=[],sel='',selGroup='',chatMode='direct',ws=null,pc=null,ls=null,rs=null,pendingCall=null,pendingIce=[],callPeer='';
function toast(s){try{NativeBridge.toast(s)}catch(_){alert(s)}}function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function authHeaders(){return token?{'Authorization':'Bearer '+token}:{}}async function api(path,opt={}){const r=await fetch(base+path,{...opt,headers:{'Content-Type':'application/json',...authHeaders(),...(opt.headers||{})}});let d={};try{d=await r.json()}catch(_){}if(!r.ok)throw Error(d.error||('HTTP '+r.status));return d}
function normalizePhone(s){return String(s||'').replace(/\D/g,'')}function phoneVariants(s){let d=normalizePhone(s),a=[];if(d.length>=7)a.push(d);if(d.length>9)a.push(d.slice(-9));if(d.length>10)a.push(d.slice(-10));return [...new Set(a)]}async function sha256(s){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}async function phoneHashes(s){let a=[];for(const v of phoneVariants(s))a.push(await sha256(v));return a}
function show(n){document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===n));document.querySelectorAll('.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.s===n));if(n==='chat')loadChat();if(n==='groups')loadGroups()}document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>show(b.dataset.s));
function showAuth(){$('authView').classList.remove('hide');$('appView').classList.add('hide');$('authServer').value=base}
function showApp(){$('authView').classList.add('hide');$('appView').classList.remove('hide');$('serverUrl').value=base}
async function checkServer(){base=$('authServer').value.trim().replace(/\/$/,'')||'http://192.168.3.3:22005';storeSet('serverUrl',base);try{let r=await fetch(base+'/health'),d=await r.json();if(!d.ok)throw Error();$('serverCheckState').textContent='✓ Сервер найден · v'+d.version;return true}catch(_){$('serverCheckState').textContent='✕ Сервер недоступен';return false}}
$('checkServer').onclick=checkServer;$('showReg').onclick=()=>{$('loginCard').classList.add('hide');$('regCard').classList.remove('hide')};$('showLogin').onclick=()=>{$('regCard').classList.add('hide');$('loginCard').classList.remove('hide')};
$('loginBtn').onclick=async()=>{try{if(!(await checkServer()))return;let r=await api('/api/login',{method:'POST',body:JSON.stringify({uin:$('loginUin').value.trim(),password:$('loginPass').value})});token=r.token;storeSet('token',token);storeSet('uin',r.user.uin);await afterAuth(r.user)}catch(e){$('authState').textContent=e.message}};
$('regBtn').onclick=async()=>{try{if(!(await checkServer()))return;let p=$('regPhone').value.trim(),r=await api('/api/register',{method:'POST',body:JSON.stringify({nick:$('regNick').value.trim(),password:$('regPass').value,phoneHashes:p?await phoneHashes(p):[]})});if(p)storeSet('myPhone',p);token=r.token;storeSet('token',token);storeSet('uin',r.user.uin);await afterAuth(r.user)}catch(e){$('authState').textContent=e.message}};
async function afterAuth(u){me=u;showApp();renderMe();await Promise.all([loadContacts(),loadGroups()]);connectWs();try{NativeBridge.bg(true);NativeBridge.play('startup')}catch(_){}}
function renderMe(){$('uin').textContent=me.uin;$('meName').textContent=me.nick;$('meAvatar').textContent=(me.nick||'?')[0];$('head').textContent=me.nick+' · '+me.status;$('status').value=me.status||'ONLINE';$('nick').value=me.nick;$('myPhone').value='';$('phoneSummary').textContent=me.phoneLinked?'Номер привязан. Для замены введи новый номер ниже.':'Номер не привязан.'}
async function loadContacts(){contacts=await api('/api/contacts');renderContacts();renderMemberChips()}
function renderContacts(){let e=$('list');e.innerHTML='';if(!contacts.length)e.innerHTML='<div class="state">Контактов пока нет.</div>';for(const c of contacts){let d=document.createElement('div');d.className='contact '+c.status;d.innerHTML='<div class="avatar">'+esc((c.nick||'?')[0])+'</div><div class="grow"><b>'+esc(c.nick)+'</b><div class="state"><span class="dot"></span>'+esc(c.status)+' · '+esc(c.uin)+'</div></div><button>Чат</button>';d.querySelector('button').onclick=()=>{chatMode='direct';sel=c.uin;selGroup='';show('chat')};e.appendChild(d)}}
function renderMemberChips(){let e=$('memberChips');e.innerHTML='';for(const c of contacts){let l=document.createElement('label');l.className='chip';l.innerHTML='<input type="checkbox" value="'+esc(c.uin)+'"> '+esc(c.nick);e.appendChild(l)}}
$('status').onchange=async()=>{try{me=await api('/api/me',{method:'PATCH',body:JSON.stringify({status:$('status').value})});renderMe()}catch(e){toast(e.message)}};
$('save').onclick=async()=>{try{me=await api('/api/me',{method:'PATCH',body:JSON.stringify({nick:$('nick').value.trim()})});renderMe()}catch(e){toast(e.message)}};
$('addBtn').onclick=async()=>{try{await api('/api/contacts',{method:'POST',body:JSON.stringify({uin:$('addUin').value.trim()})});$('addUin').value='';await loadContacts()}catch(e){toast(e.message)}};
$('syncPhone').onclick=async()=>{try{if(!NativeBridge.hasContactsPermission()){NativeBridge.requestContacts();$('syncState').textContent='Разреши доступ и нажми ещё раз.';return}let raw=JSON.parse(NativeBridge.contacts()||'[]'),set=new Set();for(const n of raw)for(const v of phoneVariants(n))set.add(await sha256(v));let r=await api('/api/contacts/sync',{method:'POST',body:JSON.stringify({hashes:[...set]})});await loadContacts();$('syncState').textContent='Найдено: '+r.added}catch(e){$('syncState').textContent=e.message}};
$('savePhone').onclick=async()=>{try{let p=$('myPhone').value.trim();if(!p)return toast('Введи новый номер');me=await api('/api/me',{method:'PATCH',body:JSON.stringify({phoneHashes:await phoneHashes(p)})});storeSet('myPhone',p);renderMe();toast('Номер заменён')}catch(e){toast(e.message)}};
$('unlinkPhone').onclick=async()=>{try{me=await api('/api/me',{method:'PATCH',body:JSON.stringify({phoneHashes:[]})});storeRemove('myPhone');renderMe();toast('Номер отвязан')}catch(e){toast(e.message)}};

async function loadGroups(){groups=await api('/api/groups');let e=$('groupList');e.innerHTML='';if(!groups.length)e.innerHTML='<div class="state">Групп пока нет.</div>';for(const g of groups){let d=document.createElement('div');d.className='group';d.innerHTML='<div class="avatar">👥</div><div class="grow"><b>'+esc(g.name)+'</b><div class="state">'+g.members.length+' участников</div></div><button>Открыть</button>';d.querySelector('button').onclick=()=>{chatMode='group';selGroup=g.id;sel='';show('chat')};e.appendChild(d)}}
$('createGroup').onclick=async()=>{try{let members=[...document.querySelectorAll('#memberChips input:checked')].map(x=>x.value),g=await api('/api/groups',{method:'POST',body:JSON.stringify({name:$('groupName').value.trim(),members})});$('groupName').value='';await loadGroups();chatMode='group';selGroup=g.id;show('chat')}catch(e){toast(e.message)}};

async function loadChat(){let list=[],title='Чат';if(chatMode==='group'&&selGroup){let g=groups.find(x=>x.id===selGroup);title=g?.name||'Группа';list=await api('/api/groups/'+selGroup+'/messages')}else if(sel){let c=contacts.find(x=>x.uin===sel);title=(c?.nick||sel);list=await api('/api/messages/'+sel)}$('chatTitle').textContent=title;renderMessages(list)}
function fileUrl(f){return base+f.url+'?token='+encodeURIComponent(token)}
function renderMessages(list){let e=$('messages');e.innerHTML='';for(const m of list){let mine=m.from===me.uin,d=document.createElement('div');d.className='b'+(mine?' me':'');let body=m.text?esc(m.text):'';if(m.file)body+=(body?'<br>':'')+'<a class="filebox" href="'+fileUrl(m.file)+'" target="_blank">📎 '+esc(m.file.name)+' · '+Math.ceil(m.file.size/1024)+' КБ</a>';d.innerHTML=body+'<span class="time">'+new Date(m.ts).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})+'</span>';e.appendChild(d)}e.scrollTop=e.scrollHeight}
async function sendMessage(){let text=$('msg').value.trim();if(!text)return;try{if(chatMode==='group'&&selGroup)await api('/api/groups/'+selGroup+'/messages',{method:'POST',body:JSON.stringify({text})});else if(sel)await api('/api/messages',{method:'POST',body:JSON.stringify({to:sel,text})});else return;$('msg').value='';try{NativeBridge.play('out')}catch(_){}await loadChat()}catch(e){toast(e.message)}}$('send').onclick=sendMessage;$('msg').onkeydown=e=>{if(e.key==='Enter')sendMessage()};
$('file').onchange=async e=>{let f=e.target.files?.[0];if(!f)return;if(f.size>100*1024*1024){toast('Файл максимум 100 МБ');return}try{$('sendState').textContent='Загружаю '+f.name+'…';let buf=new Uint8Array(await f.arrayBuffer()),s='',chunk=0x8000;for(let i=0;i<buf.length;i+=chunk)s+=String.fromCharCode(...buf.subarray(i,i+chunk));let meta=await api('/api/files',{method:'POST',body:JSON.stringify({name:f.name,type:f.type,data:btoa(s)})});if(chatMode==='group'&&selGroup)await api('/api/groups/'+selGroup+'/messages',{method:'POST',body:JSON.stringify({file:meta})});else if(sel)await api('/api/messages',{method:'POST',body:JSON.stringify({to:sel,file:meta})});$('sendState').textContent='Файл отправлен';await loadChat()}catch(x){$('sendState').textContent=x.message}e.target.value=''};

function wsUrl(){let u=new URL(base);return(u.protocol==='https:'?'wss:':'ws:')+'//'+u.host+'/ws?token='+encodeURIComponent(token)}
function connectWs(){try{ws?.close()}catch(_){}ws=new WebSocket(wsUrl());ws.onopen=()=>{$('serverState').textContent='online'};ws.onclose=()=>{$('serverState').textContent='offline';setTimeout(()=>token&&connectWs(),3000)};ws.onmessage=async ev=>{let m;try{m=JSON.parse(ev.data)}catch(_){return}if(m.type==='presence'){let i=contacts.findIndex(x=>x.uin===m.user.uin);if(i>=0){let old=contacts[i].status;contacts[i]=m.user;renderContacts();if(old!=='ONLINE'&&m.user.status==='ONLINE')try{NativeBridge.play('online')}catch(_){}}}if(m.type==='message'){if(chatMode==='direct'&&(sel===m.message.from||sel===m.message.to))await loadChat();try{NativeBridge.notify('ICQ Reborn · '+(m.from?.nick||m.message.from),m.message.text||('Файл: '+m.message.file?.name),'message')}catch(_){}}if(m.type==='group-message'){if(chatMode==='group'&&selGroup===m.group.id)await loadChat();try{NativeBridge.notify(m.group.name,m.message.text||('Файл: '+m.message.file?.name),'message')}catch(_){}}if(m.type==='group-added')await loadGroups();if(m.type==='contact-added'){await loadContacts();try{NativeBridge.notify('ICQ Reborn','Новый контакт: '+(m.user?.nick||m.user?.uin),'auth')}catch(_){}}if(m.type==='call-signal')handleSignal(m)}}
function wsSend(o){if(ws?.readyState!==1)throw Error('Нет соединения с сервером');ws.send(JSON.stringify(o))}

async function rtcConfig(){return{iceServers:[{urls:['stun:stun.cloudflare.com:3478','stun:stun.l.google.com:19302']},{urls:['turn:staticauth.openrelay.metered.ca:80','turn:staticauth.openrelay.metered.ca:443','turns:staticauth.openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}],iceCandidatePoolSize:4}}
async function newPc(peer){try{pc?.close()}catch(_){}pc=new RTCPeerConnection(await rtcConfig());callPeer=peer;pendingIce=[];pc.onicecandidate=e=>{if(e.candidate&&callPeer)wsSend({type:'call-signal',to:callPeer,signalType:'ice',payload:e.candidate})};pc.ontrack=e=>{if(!rs)rs=new MediaStream();for(const t of e.streams[0]?.getTracks()||[e.track])if(!rs.getTracks().includes(t))rs.addTrack(t);$('remote').srcObject=rs};pc.onconnectionstatechange=()=>{$('callState').textContent=pc.connectionState;if(pc.connectionState==='failed'){try{pc.restartIce()}catch(_){}}};return pc}
async function getMedia(mode){ls?.getTracks().forEach(t=>t.stop());ls=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:mode==='video'?{facingMode:'user'}:false});$('local').srcObject=ls;for(const tr of ls.getTracks())pc.addTrack(tr,ls)}
async function flushIce(){for(const c of pendingIce)try{await pc.addIceCandidate(c)}catch(_){}pendingIce=[]}
async function startCall(mode){if(chatMode!=='direct'||!sel)return toast('Для звонка открой личный чат');try{await newPc(sel);await getMedia(mode);let off=await pc.createOffer({offerToReceiveAudio:true,offerToReceiveVideo:mode==='video'});await pc.setLocalDescription(off);wsSend({type:'call-signal',to:sel,signalType:'offer',payload:{sdp:pc.localDescription,mode}});$('callState').textContent=mode==='video'?'Видеовызов…':'Аудиовызов…';show('calls')}catch(e){toast(e.message)}}
async function handleSignal(m){try{if(m.signalType==='offer'){pendingCall=m;$('incomingText').textContent='Входящий '+(m.payload.mode==='video'?'видеозвонок':'аудиозвонок')+' от '+(m.fromUser?.nick||m.from);$('incoming').classList.remove('hide');try{NativeBridge.notify('ICQ Reborn',$('incomingText').textContent,'call')}catch(_){}show('calls');return}if(m.signalType==='ice'){if(!pc||!pc.remoteDescription)pendingIce.push(m.payload);else await pc.addIceCandidate(m.payload);return}if(m.signalType==='answer'){await pc.setRemoteDescription(m.payload);await flushIce();$('callState').textContent='Звонок идёт';return}if(m.signalType==='hang'){stopCall();return}}catch(e){$('callState').textContent='Ошибка звонка: '+e.message}}
$('take').onclick=async()=>{try{let m=pendingCall;$('incoming').classList.add('hide');await newPc(m.from);await pc.setRemoteDescription(m.payload.sdp);await getMedia(m.payload.mode);await flushIce();let ans=await pc.createAnswer();await pc.setLocalDescription(ans);wsSend({type:'call-signal',to:m.from,signalType:'answer',payload:pc.localDescription});pendingCall=null;$('callState').textContent='Звонок идёт'}catch(e){$('callState').textContent='Не удалось принять: '+e.message}};
$('reject').onclick=()=>{if(pendingCall)wsSend({type:'call-signal',to:pendingCall.from,signalType:'hang',payload:{}});$('incoming').classList.add('hide');pendingCall=null};function stopCall(){ls?.getTracks().forEach(t=>t.stop());rs?.getTracks().forEach(t=>t.stop());ls=rs=null;$('local').srcObject=$('remote').srcObject=null;try{pc?.close()}catch(_){}pc=null;pendingIce=[];callPeer='';$('callState').textContent='Нет звонка'}$('hang').onclick=()=>{if(callPeer)try{wsSend({type:'call-signal',to:callPeer,signalType:'hang',payload:{}})}catch(_){}stopCall()};$('callA').onclick=()=>startCall('audio');$('callV').onclick=()=>startCall('video');$('mute').onclick=()=>{let t=ls?.getAudioTracks()[0];if(t){t.enabled=!t.enabled;$('mute').textContent=t.enabled?'🎙️':'🔇'}};$('cam').onclick=()=>{let t=ls?.getVideoTracks()[0];if(t){t.enabled=!t.enabled;$('cam').textContent=t.enabled?'📷':'🚫'}};

$('saveServer').onclick=()=>{base=$('serverUrl').value.trim().replace(/\/$/,'');storeSet('serverUrl',base);connectWs();toast('Адрес сохранён')};$('logout').onclick=()=>{token='';storeRemove('token');storeRemove('uin');try{ws?.close()}catch(_){}showAuth()};
(async()=>{
  $('authServer').value=base;$('serverUrl').value=base;
  if(!token){showAuth();return}
  try{
    const r=await fetch(base+'/api/me',{headers:{'Authorization':'Bearer '+token}});
    if(r.status===401){token='';storeRemove('token');storeRemove('uin');showAuth();return}
    if(!r.ok)throw Error('server');
    const u=await r.json();await afterAuth(u);
  }catch(_){
    showAuth();
    $('loginUin').value=storeGet('uin')||'';
    $('authState').textContent='Сессия сохранена. Сервер сейчас недоступен — запусти сервер и нажми «Войти», либо перезапусти приложение.';
  }
})();
</script></body></html>
